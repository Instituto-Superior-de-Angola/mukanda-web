name: Verificação Contínua

# Portão de qualidade do Projecto Mukanda.
# Corre em todos os Pull Requests para main e em todos os pushes de ramo.
# O deploy só acontece depois deste workflow passar em main (ver deploy.yml).

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Tipos, lint e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificação de tipos
        run: npm run tipos

      - name: Lint
        run: npm run lint

      - name: Build de produção
        run: npm run build

  identidade-visual:
    name: Identidade visual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Conformidade com o manual de identidade
        run: node scripts/verificar-identidade-visual.mjs

  seguranca:
    name: Segurança
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Segredos e dados pessoais em código
        run: npm run verificar:segredos

      - name: Vulnerabilidades em dependências
        run: npm audit --audit-level=high

  dependencias:
    name: Revisão de dependências
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Rever dependências introduzidas neste PR
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
