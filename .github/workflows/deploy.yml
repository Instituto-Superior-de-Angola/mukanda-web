name: Publicação em Produção (Vercel)

# Publica em produção apenas quando main avança — ou seja, quando um Pull Request é fundido.
# Depende do êxito da Verificação Contínua: não existe caminho para produção que a contorne.

on:
  workflow_run:
    workflows: ['Verificação Contínua']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: producao
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar no Vercel
    # Só publica se o CI passou e se a origem foi um push para main (uma fusão de PR).
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment:
      name: producao
      url: https://mukanda.acite.ao

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Publicar
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          scope: ${{ secrets.VERCEL_ORG_ID }}
