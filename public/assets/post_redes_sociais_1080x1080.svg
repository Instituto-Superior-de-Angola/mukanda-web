<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="socBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071326" />
      <stop offset="50%" stop-color="#0F2C59" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="socGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="socOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#socBg)" />

  <!-- Background Sona Lattice -->
  <g opacity="0.10" stroke="#FFFFFF" stroke-width="1.5" fill="none">
    <circle cx="540" cy="540" r="460" stroke-dasharray="6 6" />
    <circle cx="540" cy="540" r="320" />
    <polygon points="540,80 1000,540 540,1000 80,540" />
  </g>

  <!-- Top Header -->
  <g transform="translate(80, 70)">
    <text x="0" y="25" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#F59E0B" letter-spacing="4">ACITE ANGOLA APRESENTA</text>
    <text x="920" y="25" text-anchor="end" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#94A3B8">VERSÃO 2.0</text>
  </g>

  <!-- Central Symbol -->
  <g transform="translate(420, 160) scale(0.48)">
    <path d="M 250 80 C 175 80, 105 140, 105 215 C 105 290, 170 340, 230 385 L 250 400 L 250 330 C 205 295, 170 260, 170 215 C 170 175, 205 145, 250 145 Z" fill="url(#socOrange)" />
    <path d="M 250 80 C 325 80, 395 140, 395 215 C 395 290, 330 340, 270 385 L 250 400 L 250 330 C 295 295, 330 260, 330 215 C 330 175, 295 145, 250 145 Z" fill="#38BDF8" />
    <polygon points="250,155 310,230 250,305 190,230" fill="url(#socGold)" />
    <circle cx="250" cy="230" r="14" fill="#0F2C59" stroke="#FFFFFF" stroke-width="4" />
    <circle cx="250" cy="80" r="12" fill="url(#socGold)" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="105" cy="215" r="11" fill="url(#socOrange)" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="395" cy="215" r="11" fill="#38BDF8" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="250" cy="400" r="12" fill="#10B981" stroke="#FFFFFF" stroke-width="3" />
  </g>

  <!-- Typography -->
  <g text-anchor="middle">
    <text x="540" y="420" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700" fill="#FF6B35" letter-spacing="6">PROJECTO</text>
    <text x="540" y="510" font-family="'Space Grotesk', sans-serif" font-size="82" font-weight="900" fill="#FFFFFF" letter-spacing="3">MUKANDA</text>
    <rect x="240" y="535" width="600" height="4" rx="2" fill="url(#socGold)" />

    <text x="540" y="585" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700" fill="#FDE047">Quadro Angolano de Competências Digitais</text>
    <text x="540" y="625" font-family="'Inter', sans-serif" font-size="18" font-weight="500" fill="#CBD5E1">Construindo o primeiro índice psicométrico nacional (ILDA)</text>
  </g>

  <!-- Key Metrics Row -->
  <g transform="translate(80, 680)">
    <!-- Metric 1 -->
    <g transform="translate(0, 0)">
      <rect width="280" height="150" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#FF6B35" stroke-width="1.5" />
      <text x="140" y="65" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="44" font-weight="900" fill="#FF6B35">2.500</text>
      <text x="140" y="105" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Cidadãos Certificados</text>
      <text x="140" y="128" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Luanda • Huíla • Uíge</text>
    </g>

    <!-- Metric 2 -->
    <g transform="translate(320, 0)">
      <rect width="280" height="150" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#F59E0B" stroke-width="1.5" />
      <text x="140" y="65" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="44" font-weight="900" fill="#F59E0B">120</text>
      <text x="140" y="105" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Formadores Locais</text>
      <text x="140" y="128" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Capacitação Multiplicadora</text>
    </g>

    <!-- Metric 3 -->
    <g transform="translate(640, 0)">
      <rect width="280" height="150" rx="14" fill="#FFFFFF" fill-opacity="0.08" stroke="#38BDF8" stroke-width="1.5" />
      <text x="140" y="65" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="44" font-weight="900" fill="#38BDF8">48 M</text>
      <text x="140" y="105" text-anchor="middle" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Duração &amp; Impacto</text>
      <text x="140" y="128" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#94A3B8">Julho 2026 - Julho 2029</text>
    </g>
  </g>

  <!-- Bottom CTA Footer -->
  <g transform="translate(80, 880)">
    <rect width="920" height="120" rx="14" fill="#FFFFFF" />
    <text x="40" y="55" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="800" fill="#0F2C59">Acompanhe a Inclusão Digital em Angola</text>
    <text x="40" y="85" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#64748B">Siga as publicações científicas e candidaturas: www.mukanda.acite.ao</text>
    
    <rect x="680" y="32" width="200" height="55" rx="27.5" fill="url(#socOrange)" />
    <text x="780" y="66" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">SABER MAIS</text>
  </g>
</svg>