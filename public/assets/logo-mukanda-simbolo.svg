<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#0F2C59" />
      <stop offset="100%" stop-color="#071326" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F2C59" flood-opacity="0.2" />
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#F59E0B" flood-opacity="0.35" />
    </filter>
  </defs>

  <g id="Mukanda-Symbol" filter="url(#subtleGlow)">
    <!-- Left Wing (Ancestral Sona Loop / Terracotta / Community) -->
    <path d="M 250 80 
             C 175 80, 105 140, 105 215 
             C 105 290, 170 340, 230 385 
             L 250 400 
             L 250 330 
             C 205 295, 170 260, 170 215 
             C 170 175, 205 145, 250 145 
             Z" 
          fill="url(#terracottaGrad)" />

    <!-- Right Wing (Digital Cyber Loop / Indigo / Science & Data) -->
    <path d="M 250 80 
             C 325 80, 395 140, 395 215 
             C 395 290, 330 340, 270 385 
             L 250 400 
             L 250 330 
             C 295 295, 330 260, 330 215 
             C 330 175, 295 145, 250 145 
             Z" 
          fill="url(#indigoGrad)" />

    <!-- Central Sona Knowledge Core (Radiant Diamond / Portal) -->
    <polygon points="250,155 310,230 250,305 190,230" fill="url(#goldGrad)" filter="url(#goldGlow)" />

    <!-- Central Node (ILDA / Core Index) -->
    <circle cx="250" cy="230" r="14" fill="#0F2C59" stroke="#FFFFFF" stroke-width="4" />
    <circle cx="250" cy="230" r="5" fill="#F59E0B" />

    <!-- Top Beacon Node (Vision & Framework) -->
    <circle cx="250" cy="80" r="12" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="3" />

    <!-- Left Regional Node (Uíge - Rural) -->
    <circle cx="105" cy="215" r="11" fill="url(#terracottaGrad)" stroke="#FFFFFF" stroke-width="3" />

    <!-- Right Regional Node (Huíla - Urban Interior) -->
    <circle cx="395" cy="215" r="11" fill="url(#indigoGrad)" stroke="#FFFFFF" stroke-width="3" />

    <!-- Bottom Convergence Node (Luanda - Metropolitan) -->
    <circle cx="250" cy="400" r="12" fill="url(#emeraldGrad)" stroke="#FFFFFF" stroke-width="3" />

    <!-- Neural Network Sona Connections (Digital Synapses) -->
    <line x1="250" y1="80" x2="250" y2="155" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 6" />
    <line x1="105" y1="215" x2="190" y2="230" stroke="#FF6B35" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 5" />
    <line x1="395" y1="215" x2="310" y2="230" stroke="#1E3A8A" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 5" />
    <line x1="250" y1="305" x2="250" y2="400" stroke="#059669" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 6" />

    <!-- Tusona Matrix Anchor Dots -->
    <circle cx="175" cy="135" r="5" fill="#FF6B35" opacity="0.9" />
    <circle cx="325" cy="135" r="5" fill="#1E3A8A" opacity="0.9" />
    <circle cx="175" cy="325" r="5" fill="#C2410C" opacity="0.9" />
    <circle cx="325" cy="325" r="5" fill="#0F2C59" opacity="0.9" />
  </g>
</svg>