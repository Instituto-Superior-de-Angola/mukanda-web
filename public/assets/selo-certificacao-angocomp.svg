<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sealGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="sealIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F2C59" />
    </linearGradient>
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F2C59" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#sealShadow)">
    <!-- Outer Starburst/Rosette / 36-pointed gear -->
    <circle cx="250" cy="250" r="235" fill="url(#sealGold)" />
    
    <!-- Outer Ring -->
    <circle cx="250" cy="250" r="215" fill="#0F2C59" stroke="#FDE047" stroke-width="4" />
    <circle cx="250" cy="250" r="208" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="4 4" />
    
    <!-- Text Along Circular Path -->
    <path id="textPathTop" d="M 75 250 A 175 175 0 0 1 425 250" fill="none" />
    <path id="textPathBottom" d="M 425 250 A 175 175 0 0 1 75 250" fill="none" />

    <text font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="800" fill="#FFFBEB" letter-spacing="3.5">
      <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
        ★ CERTIFICAÇÃO OFICIAL ANGOCOMP ★
      </textPath>
    </text>

    <text font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#FCD34D" letter-spacing="3">
      <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
        • PROJECTO MUKANDA • ACITE ANGOLA •
      </textPath>
    </text>

    <!-- Inner Core Circle -->
    <circle cx="250" cy="250" r="145" fill="url(#sealGold)" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="250" cy="250" r="138" fill="#FFFFFF" />

    <!-- Center Icon + Text -->
    <g transform="translate(185, 140) scale(0.26)">
      <path d="M 250 80 C 175 80, 105 140, 105 215 C 105 290, 170 340, 230 385 L 250 400 L 250 330 C 205 295, 170 260, 170 215 C 170 175, 205 145, 250 145 Z" fill="#C2410C" />
      <path d="M 250 80 C 325 80, 395 140, 395 215 C 395 290, 330 340, 270 385 L 250 400 L 250 330 C 295 295, 330 260, 330 215 C 330 175, 295 145, 250 145 Z" fill="#0F2C59" />
      <polygon points="250,155 310,230 250,305 190,230" fill="#F59E0B" />
      <circle cx="250" cy="230" r="14" fill="#0F2C59" stroke="#FFFFFF" stroke-width="4" />
      <circle cx="250" cy="80" r="12" fill="#F59E0B" stroke="#FFFFFF" stroke-width="3" />
      <circle cx="105" cy="215" r="11" fill="#C2410C" stroke="#FFFFFF" stroke-width="3" />
      <circle cx="395" cy="215" r="11" fill="#0F2C59" stroke="#FFFFFF" stroke-width="3" />
      <circle cx="250" cy="400" r="12" fill="#059669" stroke="#FFFFFF" stroke-width="3" />
    </g>

    <text x="250" y="275" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="900" fill="#0F2C59" letter-spacing="1">LITERACIA</text>
    <text x="250" y="298" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="900" fill="#0F2C59" letter-spacing="1">DIGITAL</text>
    <text x="250" y="322" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#C2410C" letter-spacing="2">PADRÃO NACIONAL</text>
    <text x="250" y="342" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#64748B">VALIDADO CIENTIFICAMENTE</text>
  </g>
</svg>