<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="banBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071326" />
      <stop offset="45%" stop-color="#0F2C59" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="banGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="banTerracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#banBg)" />

  <!-- Background Sona Pattern Lines -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1.5" fill="none">
    <circle cx="1000" cy="315" r="380" stroke-dasharray="6 6" />
    <polygon points="1000,50 1250,315 1000,580 750,315" />
  </g>

  <!-- Left Content Column -->
  <g transform="translate(80, 80)">
    <text x="0" y="30" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" fill="#F59E0B" letter-spacing="4">ACADEMIA DE CIÊNCIAS SOCIAIS E TECNOLOGIAS (ACITE)</text>
    
    <text x="0" y="115" font-family="'Space Grotesk', sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="2">PROJECTO MUKANDA</text>
    
    <rect x="0" y="140" width="550" height="4" rx="2" fill="url(#banGold)" />

    <text x="0" y="185" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700" fill="#FDE047">Quadro Angolano de Competências Digitais (AngoComp)</text>
    <text x="0" y="225" font-family="'Inter', sans-serif" font-size="16" font-weight="400" fill="#CBD5E1">Investigação Aplicada, Diagnóstico Psicométrico e Inclusão Digital Nacional.</text>
    <text x="0" y="255" font-family="'Inter', sans-serif" font-size="15" font-weight="600" fill="#38BDF8">Piloto em Luanda, Huíla e Uíge • Certificação de 2.500 Cidadãos</text>

    <!-- Bottom Buttons / Links -->
    <g transform="translate(0, 310)">
      <rect width="240" height="50" rx="25" fill="url(#banTerracotta)" />
      <text x="120" y="32" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">CONHEÇA O PROJETO</text>

      <text x="270" y="32" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#CBD5E1">www.mukanda.acite.ao</text>
    </g>
  </g>

  <!-- Right Visual Lockup -->
  <g transform="translate(860, 160) scale(0.65)">
    <path d="M 250 80 C 175 80, 105 140, 105 215 C 105 290, 170 340, 230 385 L 250 400 L 250 330 C 205 295, 170 260, 170 215 C 170 175, 205 145, 250 145 Z" fill="url(#banTerracotta)" />
    <path d="M 250 80 C 325 80, 395 140, 395 215 C 395 290, 330 340, 270 385 L 250 400 L 250 330 C 295 295, 330 260, 330 215 C 330 175, 295 145, 250 145 Z" fill="#38BDF8" />
    <polygon points="250,155 310,230 250,305 190,230" fill="url(#banGold)" />
    <circle cx="250" cy="230" r="14" fill="#0F2C59" stroke="#FFFFFF" stroke-width="4" />
    <circle cx="250" cy="80" r="12" fill="url(#banGold)" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="105" cy="215" r="11" fill="url(#banTerracotta)" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="395" cy="215" r="11" fill="#38BDF8" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="250" cy="400" r="12" fill="#10B981" stroke="#FFFFFF" stroke-width="3" />
  </g>
</svg>