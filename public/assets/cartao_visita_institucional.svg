<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cardFrontBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071326" />
      <stop offset="100%" stop-color="#0F2C59" />
    </linearGradient>
    <linearGradient id="cvGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="cvOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
  </defs>

  <!-- ================= FRENTE (ESQUERDA) ================= -->
  <g transform="translate(30, 50)">
    <rect width="450" height="260" rx="12" fill="url(#cardFrontBg)" stroke="#1E3A8A" stroke-width="1.5" />
    
    <!-- Big Centered Symbol on Front -->
    <g transform="translate(180, 40) scale(0.18)">
      <path d="M 250 80 C 175 80, 105 140, 105 215 C 105 290, 170 340, 230 385 L 250 400 L 250 330 C 205 295, 170 260, 170 215 C 170 175, 205 145, 250 145 Z" fill="url(#cvOrange)" />
      <path d="M 250 80 C 325 80, 395 140, 395 215 C 395 290, 330 340, 270 385 L 250 400 L 250 330 C 295 295, 330 260, 330 215 C 330 175, 295 145, 250 145 Z" fill="#38BDF8" />
      <polygon points="250,155 310,230 250,305 190,230" fill="url(#cvGold)" />
      <circle cx="250" cy="230" r="14" fill="#0F2C59" stroke="#FFFFFF" stroke-width="4" />
      <circle cx="250" cy="80" r="12" fill="url(#cvGold)" stroke="#FFFFFF" stroke-width="3" />
      <circle cx="105" cy="215" r="11" fill="url(#cvOrange)" stroke="#FFFFFF" stroke-width="3" />
      <circle cx="395" cy="215" r="11" fill="#38BDF8" stroke="#FFFFFF" stroke-width="3" />
      <circle cx="250" cy="400" r="12" fill="#10B981" stroke="#FFFFFF" stroke-width="3" />
    </g>

    <text x="225" y="155" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#FF6B35" letter-spacing="4">PROJECTO</text>
    <text x="225" y="190" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" letter-spacing="2">MUKANDA</text>
    <rect x="150" y="202" width="150" height="2" fill="url(#cvGold)" />
    <text x="225" y="222" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#FDE047">Quadro Angolano de Competências Digitais</text>
    <text x="225" y="240" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8.5" font-weight="500" fill="#94A3B8">ACITE • Luanda, Angola</text>
    
    <text x="225" y="285" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#64748B">FRENTE</text>
  </g>

  <!-- ================= VERSO (DIREITA) ================= -->
  <g transform="translate(520, 50)">
    <rect width="450" height="260" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    
    <!-- Top Bar -->
    <rect x="0" y="0" width="450" height="6" rx="6 6 0 0" fill="#0F2C59" />

    <!-- Name & Title -->
    <text x="35" y="48" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="900" fill="#0F2C59">Eng. Benone Marcos, PhD</text>
    <text x="35" y="68" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#C2410C">Investigador Principal • Coordenador Geral</text>
    <text x="35" y="84" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500" fill="#64748B">Academia de Ciências Sociais e Tecnologias (ACITE)</text>

    <line x1="35" y1="100" x2="415" y2="100" stroke="#E2E8F0" stroke-width="1" />

    <!-- Contact details -->
    <g transform="translate(35, 125)" font-family="'Inter', sans-serif" font-size="10" fill="#334155">
      <text x="0" y="0">📱 +244 9XX XXX XXX</text>
      <text x="0" y="22">✉️ bmarcos@acite.ao / investigacao@acite.ao</text>
      <text x="0" y="44">🌐 www.mukanda.acite.ao</text>
      <text x="0" y="66">📍 Luanda, República de Angola</text>
    </g>

    <!-- Mini Project Symbol in corner -->
    <g transform="translate(370, 160) scale(0.12)">
      <path d="M 250 80 C 175 80, 105 140, 105 215 C 105 290, 170 340, 230 385 L 250 400 L 250 330 C 205 295, 170 260, 170 215 C 170 175, 205 145, 250 145 Z" fill="#C2410C" />
      <path d="M 250 80 C 325 80, 395 140, 395 215 C 395 290, 330 340, 270 385 L 250 400 L 250 330 C 295 295, 330 260, 330 215 C 330 175, 295 145, 250 145 Z" fill="#0F2C59" />
      <polygon points="250,155 310,230 250,305 190,230" fill="#F59E0B" />
    </g>

    <text x="225" y="285" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#64748B">VERSO</text>
  </g>
</svg>