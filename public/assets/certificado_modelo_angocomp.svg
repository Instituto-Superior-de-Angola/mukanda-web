<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1414 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="certBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2C59" />
      <stop offset="50%" stop-color="#C2410C" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="certGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#FCFBF9" />

  <!-- Outer Double Borders with Sona Corner Ornaments -->
  <rect x="40" y="40" width="1334" height="920" rx="8" fill="none" stroke="url(#certBorder)" stroke-width="8" />
  <rect x="55" y="55" width="1304" height="890" rx="4" fill="none" stroke="#0F2C59" stroke-width="2" stroke-dasharray="8 4" />

  <!-- Top Institutional Header -->
  <g transform="translate(100, 90)">
    <!-- ACITE Logo Text Left -->
    <text x="0" y="35" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="900" fill="#0F2C59" letter-spacing="2">ACITE</text>
    <text x="0" y="58" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#64748B">Academia de Ciências Sociais e Tecnologias</text>
    <text x="0" y="74" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Instituto Superior de Angola</text>

    <!-- Project Mukanda Centered -->
    <text x="607" y="30" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#FF6B35" letter-spacing="5">PROJECTO MUKANDA</text>
    <text x="607" y="60" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="900" fill="#0F2C59" letter-spacing="2">QUADRO ANGOLANO DE COMPETÊNCIAS DIGITAIS</text>
    <text x="607" y="82" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#C2410C">AngoComp • Padrão Científico Nacional de Literacia Digital</text>
  </g>

  <!-- Big Certificate Word -->
  <g text-anchor="middle">
    <text x="707" y="270" font-family="'Space Grotesk', 'Outfit', sans-serif" font-size="56" font-weight="900" fill="#0F2C59" letter-spacing="8">CERTIFICADO</text>
    <text x="707" y="305" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#64748B" letter-spacing="3">DE PROFICIÊNCIA E CAPACITAÇÃO DIGITAL</text>
    
    <rect x="507" y="325" width="400" height="3" rx="1.5" fill="url(#certGold)" />

    <!-- Certification Statement -->
    <text x="707" y="385" font-family="'Inter', sans-serif" font-size="18" font-weight="400" fill="#334155">Certifica-se, para os devidos efeitos legais e académicos, que</text>
    
    <!-- Recipient Name Holder -->
    <text x="707" y="460" font-family="'Space Grotesk', 'Outfit', sans-serif" font-size="44" font-weight="900" fill="#C2410C">[NOME COMPLETO DO(A) CIDADÃO(Ã)]</text>
    <line x1="300" y1="485" x2="1114" y2="485" stroke="#CBD5E1" stroke-width="1.5" />
    
    <text x="707" y="525" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#475569">Portador(a) do B.I. n.º [000000000XX000], concluiu com aproveitamento o programa de avaliação e capacitação do</text>
    <text x="707" y="555" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#0F2C59">Quadro Angolano de Competências Digitais (AngoComp - Nível Intermédio B2)</text>
    <text x="707" y="585" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="#475569">com carga horária de 60 horas, abrangendo as 5 Dimensões Estruturantes do Índice ILDA, na Província de [Luanda / Huíla / Uíge].</text>
  </g>

  <!-- Bottom Seals & Signatures Area -->
  <g transform="translate(120, 680)">
    <!-- Signature 1: Investigador Principal -->
    <g transform="translate(80, 60)">
      <line x1="0" y1="0" x2="280" y2="0" stroke="#0F2C59" stroke-width="1.5" />
      <text x="140" y="25" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800" fill="#0F2C59">Eng. Benone Marcos, PhD</text>
      <text x="140" y="45" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#64748B">Investigador Principal / Coordenador</text>
      <text x="140" y="62" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#94A3B8">Projecto Mukanda - ACITE</text>
    </g>

    <!-- Center Official Seal -->
    <g transform="translate(500, -20) scale(0.36)">
      <!-- Integrated Seal -->
      <circle cx="250" cy="250" r="230" fill="url(#certGold)" />
      <circle cx="250" cy="250" r="210" fill="#0F2C59" stroke="#FDE047" stroke-width="4" />
      <text x="250" y="230" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">SELO OFICIAL</text>
      <text x="250" y="265" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="800" fill="#FDE047">ANGOCOMP</text>
      <text x="250" y="300" text-anchor="middle" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">ACITE ANGOLA</text>
    </g>

    <!-- Signature 2: Direcção ACITE / MESCTI -->
    <g transform="translate(820, 60)">
      <line x1="0" y1="0" x2="280" y2="0" stroke="#0F2C59" stroke-width="1.5" />
      <text x="140" y="25" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800" fill="#0F2C59">Direcção Científica</text>
      <text x="140" y="45" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#64748B">Conselho Científico da ACITE</text>
      <text x="140" y="62" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#94A3B8">Instituto Superior de Angola</text>
    </g>
  </g>

  <!-- Certificate Metadata Footer -->
  <g transform="translate(100, 915)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#94A3B8">Certificado N.º: MUK-2026-002500 • Registo Livro III, Fls. 45 • Autenticidade verificável em https://mukanda.acite.ao/validar</text>
    <text x="1214" y="0" text-anchor="end" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#64748B">Emitido em Luanda, [Data por extenso]</text>
  </g>
</svg>