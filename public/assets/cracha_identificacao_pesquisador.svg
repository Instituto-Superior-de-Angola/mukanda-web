<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 550" width="100%" height="100%">
  <defs>
    <linearGradient id="crHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071326" />
      <stop offset="100%" stop-color="#0F2C59" />
    </linearGradient>
    <linearGradient id="crOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
  </defs>

  <!-- Card Body -->
  <rect width="350" height="550" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />

  <!-- Lanyard Hole -->
  <rect x="145" y="15" width="60" height="10" rx="5" fill="#E2E8F0" />

  <!-- Header Section -->
  <rect x="0" y="38" width="350" height="110" fill="url(#crHeader)" />
  <text x="175" y="70" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#F59E0B" letter-spacing="2">ACITE • INVESTIGAÇÃO DE CAMPO</text>
  <text x="175" y="98" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="2">PROJECTO MUKANDA</text>
  <text x="175" y="122" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#CBD5E1">Quadro Angolano de Competências Digitais</text>

  <!-- Photo Box -->
  <g transform="translate(115, 170)">
    <rect width="120" height="140" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5" />
    <circle cx="60" cy="55" r="28" fill="#CBD5E1" />
    <path d="M 25 125 C 25 95, 95 95, 95 125 Z" fill="#CBD5E1" />
    <text x="60" y="135" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#64748B">FOTO OFICIAL</text>
  </g>

  <!-- Identity Info -->
  <g text-anchor="middle">
    <text x="175" y="340" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="900" fill="#0F2C59">[NOME DO INVESTIGADOR]</text>
    <rect x="85" y="355" width="180" height="26" rx="13" fill="url(#crOrange)" />
    <text x="175" y="372" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" letter-spacing="1">INVESTIGADOR DE CAMPO</text>
    
    <text x="175" y="410" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#334155">Província: Luanda / Huíla / Uíge</text>
    <text x="175" y="428" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#64748B">ID Credencial: MUK-INV-2026-042</text>
    <text x="175" y="444" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#64748B">Válido até: Julho de 2029</text>
  </g>

  <!-- Bottom Strip -->
  <g transform="translate(0, 480)">
    <rect width="350" height="70" rx="0 0 18 18" fill="#F8FAFC" />
    <line x1="0" y1="0" x2="350" y2="0" stroke="#E2E8F0" stroke-width="1" />
    <text x="175" y="25" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#64748B">Credencial Oficial de Inquérito Populacional</text>
    <text x="175" y="42" text-anchor="middle" font-family="'Inter', sans-serif" font-size="8.5" font-weight="500" fill="#94A3B8">Contacto de Urgência: +244 9XX XXX XXX • acite.ao</text>
  </g>
</svg>