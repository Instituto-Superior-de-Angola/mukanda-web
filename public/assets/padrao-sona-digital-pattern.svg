<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <pattern id="sonaMatrix" width="160" height="160" patternUnits="userSpaceOnUse">
      <!-- Background Grid Lines -->
      <path d="M 0 80 L 160 80 M 80 0 L 80 160" stroke="#0F2C59" stroke-width="0.75" stroke-opacity="0.08" stroke-dasharray="3 3" />
      <path d="M 0 0 L 160 160 M 160 0 L 0 160" stroke="#C2410C" stroke-width="0.5" stroke-opacity="0.05" />

      <!-- Sona Endless Loops -->
      <circle cx="80" cy="80" r="48" fill="none" stroke="#0F2C59" stroke-width="1.5" stroke-opacity="0.12" />
      <circle cx="0" cy="0" r="32" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.15" />
      <circle cx="160" cy="0" r="32" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.15" />
      <circle cx="0" cy="160" r="32" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.15" />
      <circle cx="160" cy="160" r="32" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.15" />

      <!-- Diamond Connection -->
      <polygon points="80,20 140,80 80,140 20,80" fill="none" stroke="#C2410C" stroke-width="1.2" stroke-opacity="0.15" />

      <!-- Sona Matrix Nodes -->
      <circle cx="80" cy="80" r="4" fill="#0F2C59" fill-opacity="0.25" />
      <circle cx="80" cy="20" r="3" fill="#F59E0B" fill-opacity="0.3" />
      <circle cx="140" cy="80" r="3" fill="#C2410C" fill-opacity="0.3" />
      <circle cx="80" cy="140" r="3" fill="#059669" fill-opacity="0.3" />
      <circle cx="20" cy="80" r="3" fill="#C2410C" fill-opacity="0.3" />
      
      <!-- Corner Dots -->
      <circle cx="0" cy="0" r="3.5" fill="#0F2C59" fill-opacity="0.2" />
      <circle cx="160" cy="0" r="3.5" fill="#0F2C59" fill-opacity="0.2" />
      <circle cx="0" cy="160" r="3.5" fill="#0F2C59" fill-opacity="0.2" />
      <circle cx="160" cy="160" r="3.5" fill="#0F2C59" fill-opacity="0.2" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#F8F9FA" />
  <rect width="100%" height="100%" fill="url(#sonaMatrix)" />
</svg>