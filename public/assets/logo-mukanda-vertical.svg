<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" width="100%" height="100%">
  <defs>
    <linearGradient id="vTerracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="vIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#0F2C59" />
      <stop offset="100%" stop-color="#071326" />
    </linearGradient>
    <linearGradient id="vGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="vEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- ISOTYPE (Centered at top) -->
  <g transform="translate(160, 20) scale(0.56)">
    <path d="M 250 80 C 175 80, 105 140, 105 215 C 105 290, 170 340, 230 385 L 250 400 L 250 330 C 205 295, 170 260, 170 215 C 170 175, 205 145, 250 145 Z" fill="url(#vTerracotta)" />
    <path d="M 250 80 C 325 80, 395 140, 395 215 C 395 290, 330 340, 270 385 L 250 400 L 250 330 C 295 295, 330 260, 330 215 C 330 175, 295 145, 250 145 Z" fill="url(#vIndigo)" />
    <polygon points="250,155 310,230 250,305 190,230" fill="url(#vGold)" />
    <circle cx="250" cy="230" r="14" fill="#0F2C59" stroke="#FFFFFF" stroke-width="4" />
    <circle cx="250" cy="230" r="5" fill="#F59E0B" />
    <circle cx="250" cy="80" r="12" fill="url(#vGold)" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="105" cy="215" r="11" fill="url(#vTerracotta)" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="395" cy="215" r="11" fill="url(#vIndigo)" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="250" cy="400" r="12" fill="url(#vEmerald)" stroke="#FFFFFF" stroke-width="3" />
    <line x1="250" y1="80" x2="250" y2="155" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 6" />
    <line x1="105" y1="215" x2="190" y2="230" stroke="#FF6B35" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 5" />
    <line x1="395" y1="215" x2="310" y2="230" stroke="#1E3A8A" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 5" />
    <line x1="250" y1="305" x2="250" y2="400" stroke="#059669" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 6" />
  </g>

  <!-- TYPOGRAPHY CENTERED -->
  <g text-anchor="middle">
    <text x="300" y="320" font-family="'Space Grotesk', 'Montserrat', sans-serif" font-size="22" font-weight="700" fill="#FF6B35" letter-spacing="8">PROJECTO</text>
    <text x="300" y="405" font-family="'Space Grotesk', 'Outfit', sans-serif" font-size="82" font-weight="900" fill="#0F2C59" letter-spacing="4">MUKANDA</text>
    
    <!-- Divider -->
    <rect x="200" y="435" width="200" height="4" rx="2" fill="url(#vGold)" />
    
    <text x="300" y="480" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="#C2410C" letter-spacing="0.5">Quadro Angolano de</text>
    <text x="300" y="515" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="#C2410C" letter-spacing="0.5">Competências Digitais (AngoComp)</text>
    
    <text x="300" y="575" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#64748B">Academia de Ciências Sociais e Tecnologias (ACITE)</text>
    <text x="300" y="605" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#0F2C59" letter-spacing="1">LUANDA • HUÍLA • UÍGE</text>
  </g>
</svg>