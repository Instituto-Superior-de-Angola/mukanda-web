<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <linearGradient id="stBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040D1B" />
      <stop offset="30%" stop-color="#0F2C59" />
      <stop offset="70%" stop-color="#0F2C59" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="stGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="stOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#stBg)" />

  <!-- Top Progress Bar Decoration -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="960" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.3" />
    <rect x="0" y="0" width="480" height="4" rx="2" fill="#F59E0B" />
  </g>

  <!-- Brand Subheader -->
  <g transform="translate(80, 120)">
    <text x="0" y="30" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#F59E0B" letter-spacing="3">ACADEMIA DE CIÊNCIAS SOCIAIS E TECNOLOGIAS</text>
    <text x="0" y="60" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#94A3B8">Iniciativa Estruturante de Literacia Digital</text>
  </g>

  <!-- Big Symbol -->
  <g transform="translate(415, 260) scale(0.50)">
    <path d="M 250 80 C 175 80, 105 140, 105 215 C 105 290, 170 340, 230 385 L 250 400 L 250 330 C 205 295, 170 260, 170 215 C 170 175, 205 145, 250 145 Z" fill="url(#stOrange)" />
    <path d="M 250 80 C 325 80, 395 140, 395 215 C 395 290, 330 340, 270 385 L 250 400 L 250 330 C 295 295, 330 260, 330 215 C 330 175, 295 145, 250 145 Z" fill="#38BDF8" />
    <polygon points="250,155 310,230 250,305 190,230" fill="url(#stGold)" />
    <circle cx="250" cy="230" r="14" fill="#0F2C59" stroke="#FFFFFF" stroke-width="4" />
    <circle cx="250" cy="80" r="12" fill="url(#stGold)" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="105" cy="215" r="11" fill="url(#stOrange)" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="395" cy="215" r="11" fill="#38BDF8" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="250" cy="400" r="12" fill="#10B981" stroke="#FFFFFF" stroke-width="3" />
  </g>

  <!-- Title Center -->
  <g text-anchor="middle">
    <text x="540" y="530" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700" fill="#FF6B35" letter-spacing="6">PROJECTO</text>
    <text x="540" y="630" font-family="'Space Grotesk', sans-serif" font-size="96" font-weight="900" fill="#FFFFFF" letter-spacing="4">MUKANDA</text>
    <rect x="240" y="660" width="600" height="5" rx="2.5" fill="url(#stGold)" />

    <text x="540" y="720" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="700" fill="#FDE047">Quadro Angolano de</text>
    <text x="540" y="765" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="700" fill="#FDE047">Competências Digitais</text>
    <text x="540" y="815" font-family="'Inter', sans-serif" font-size="20" font-weight="500" fill="#CBD5E1">AngoComp • Versão 2.0</text>
  </g>

  <!-- Interactive Story Cards Stack -->
  <g transform="translate(80, 890)">
    <g transform="translate(0, 0)">
      <rect width="920" height="150" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FF6B35" stroke-width="1.5" />
      <text x="50" y="60" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">📚 Metodologia de Elevado Rigor</text>
      <text x="50" y="100" font-family="'Inter', sans-serif" font-size="16" font-weight="400" fill="#CBD5E1">Adaptação científica do DigComp 2.2 com inquérito N=1.500</text>
    </g>

    <g transform="translate(0, 180)">
      <rect width="920" height="150" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#F59E0B" stroke-width="1.5" />
      <text x="50" y="60" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">🎯 Impacto Social e Regional</text>
      <text x="50" y="100" font-family="'Inter', sans-serif" font-size="16" font-weight="400" fill="#CBD5E1">2.500 cidadãos e 120 formadores em Luanda, Huíla e Uíge</text>
    </g>

    <g transform="translate(0, 360)">
      <rect width="920" height="150" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#38BDF8" stroke-width="1.5" />
      <text x="50" y="60" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">🏛️ Soberania em Políticas Públicas</text>
      <text x="50" y="100" font-family="'Inter', sans-serif" font-size="16" font-weight="400" fill="#CBD5E1">Criação do Índice ILDA transferido para o MESCTI e o INE</text>
    </g>
  </g>

  <!-- Swipe Up CTA -->
  <g transform="translate(540, 1620)" text-anchor="middle">
    <!-- Arrow up animated shape -->
    <path d="M 525 0 L 540 -15 L 555 0 M 525 15 L 540 0 L 555 15" stroke="#F59E0B" stroke-width="3" fill="none" stroke-linecap="round" />
    <rect x="-180" y="40" width="360" height="60" rx="30" fill="url(#stOrange)" />
    <text x="0" y="78" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="1">ARRASTE PARA CIMA</text>
    <text x="0" y="135" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#94A3B8">www.mukanda.acite.ao</text>
  </g>
</svg>