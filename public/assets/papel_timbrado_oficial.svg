<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 827 1169" width="100%" height="100%">
  <defs>
    <linearGradient id="ptGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="ptOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
  </defs>

  <!-- Sheet Canvas -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="827" height="8" fill="#0F2C59" />
  <rect x="0" y="8" width="400" height="4" fill="url(#ptOrange)" />
  <rect x="400" y="8" width="200" height="4" fill="url(#ptGold)" />

  <!-- Header Header -->
  <g transform="translate(60, 45)">
    <!-- Small Mukanda Symbol -->
    <g transform="translate(0, 0) scale(0.20)">
      <path d="M 250 80 C 175 80, 105 140, 105 215 C 105 290, 170 340, 230 385 L 250 400 L 250 330 C 205 295, 170 260, 170 215 C 170 175, 205 145, 250 145 Z" fill="#C2410C" />
      <path d="M 250 80 C 325 80, 395 140, 395 215 C 395 290, 330 340, 270 385 L 250 400 L 250 330 C 295 295, 330 260, 330 215 C 330 175, 295 145, 250 145 Z" fill="#0F2C59" />
      <polygon points="250,155 310,230 250,305 190,230" fill="#F59E0B" />
      <circle cx="250" cy="230" r="14" fill="#0F2C59" stroke="#FFFFFF" stroke-width="4" />
    </g>

    <text x="120" y="28" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#FF6B35" letter-spacing="4">PROJECTO MUKANDA</text>
    <text x="120" y="52" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="900" fill="#0F2C59">Quadro Angolano de Competências Digitais</text>
    <text x="120" y="70" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500" fill="#64748B">AngoComp • Academia de Ciências Sociais e Tecnologias (ACITE)</text>

    <!-- Right Header Note -->
    <text x="707" y="32" text-anchor="end" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="900" fill="#0F2C59">ACITE</text>
    <text x="707" y="50" text-anchor="end" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500" fill="#94A3B8">Luanda, Angola</text>

    <line x1="0" y1="88" x2="707" y2="88" stroke="#E2E8F0" stroke-width="1.5" />
  </g>

  <!-- Watermark in Center (Very Subtle) -->
  <g transform="translate(263, 434) scale(0.60)" opacity="0.03">
    <path d="M 250 80 C 175 80, 105 140, 105 215 C 105 290, 170 340, 230 385 L 250 400 L 250 330 C 205 295, 170 260, 170 215 C 170 175, 205 145, 250 145 Z" fill="#0F2C59" />
    <path d="M 250 80 C 325 80, 395 140, 395 215 C 395 290, 330 340, 270 385 L 250 400 L 250 330 C 295 295, 330 260, 330 215 C 330 175, 295 145, 250 145 Z" fill="#0F2C59" />
    <polygon points="250,155 310,230 250,305 190,230" fill="#0F2C59" />
  </g>

  <!-- Content Area Simulator Lines -->
  <g transform="translate(60, 180)" fill="#64748B" font-family="'Inter', sans-serif" font-size="12">
    <text x="0" y="0" fill="#94A3B8">Ofício N.º [___]/MUKANDA/ACITE/2026</text>
    <text x="0" y="30" fill="#0F2C59" font-weight="700">Assunto: [Assunto do Documento Oficial / Notificação Institucional]</text>
    
    <!-- Body Placeholder Text -->
    <text x="0" y="80" fill="#475569">Exmo.(a) Senhor(a),</text>
    <text x="0" y="120" fill="#475569">No âmbito da execução e implementação das acções previstas no Projecto MUKANDA (Quadro Angolano</text>
    <text x="0" y="145" fill="#475569">de Competências Digitais - AngoComp), vimos por este meio comunicar...</text>
  </g>

  <!-- Footer -->
  <g transform="translate(60, 1080)">
    <line x1="0" y1="0" x2="707" y2="0" stroke="#CBD5E1" stroke-width="1" />
    <text x="0" y="25" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#0F2C59">Projecto MUKANDA • Academia de Ciências Sociais e Tecnologias (ACITE)</text>
    <text x="0" y="42" font-family="'Inter', sans-serif" font-size="8.5" font-weight="400" fill="#64748B">Rua Rainha Ginga / Campus Universitário • Luanda, Angola • E-mail: investigacao@acite.ao</text>
    <text x="707" y="35" text-anchor="end" font-family="'Space Grotesk', sans-serif" font-size="9.5" font-weight="700" fill="#C2410C">www.mukanda.acite.ao</text>
  </g>
