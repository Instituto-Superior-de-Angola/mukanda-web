<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <linearGradient id="pTerracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="pIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#0F2C59" />
      <stop offset="100%" stop-color="#071326" />
    </linearGradient>
    <linearGradient id="pGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="pEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F2C59" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- ISOTYPE (Scaled & Centered around x=140, y=140) -->
  <g transform="translate(15, 10) scale(0.52)" filter="url(#pGlow)">
    <path d="M 250 80 C 175 80, 105 140, 105 215 C 105 290, 170 340, 230 385 L 250 400 L 250 330 C 205 295, 170 260, 170 215 C 170 175, 205 145, 250 145 Z" fill="url(#pTerracotta)" />
    <path d="M 250 80 C 325 80, 395 140, 395 215 C 395 290, 330 340, 270 385 L 250 400 L 250 330 C 295 295, 330 260, 330 215 C 330 175, 295 145, 250 145 Z" fill="url(#pIndigo)" />
    <polygon points="250,155 310,230 250,305 190,230" fill="url(#pGold)" />
    <circle cx="250" cy="230" r="14" fill="#0F2C59" stroke="#FFFFFF" stroke-width="4" />
    <circle cx="250" cy="230" r="5" fill="#F59E0B" />
    <circle cx="250" cy="80" r="12" fill="url(#pGold)" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="105" cy="215" r="11" fill="url(#pTerracotta)" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="395" cy="215" r="11" fill="url(#pIndigo)" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="250" cy="400" r="12" fill="url(#pEmerald)" stroke="#FFFFFF" stroke-width="3" />
    <line x1="250" y1="80" x2="250" y2="155" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 6" />
    <line x1="105" y1="215" x2="190" y2="230" stroke="#FF6B35" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 5" />
    <line x1="395" y1="215" x2="310" y2="230" stroke="#1E3A8A" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 5" />
    <line x1="250" y1="305" x2="250" y2="400" stroke="#059669" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 6" />
  </g>

  <!-- TYPOGRAPHY / LOGOTYPE -->
  <g transform="translate(300, 0)">
    <!-- Label / Category -->
    <text x="0" y="75" font-family="'Space Grotesk', 'Montserrat', 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#FF6B35" letter-spacing="6">PROJECTO</text>
    
    <!-- Main Brand Name -->
    <text x="0" y="148" font-family="'Space Grotesk', 'Outfit', 'Montserrat', sans-serif" font-size="78" font-weight="900" fill="#0F2C59" letter-spacing="3">MUKANDA</text>
    
    <!-- Golden Accent Node on the 'A' -->
    <circle cx="378" cy="100" r="6" fill="#F59E0B" />

    <!-- Subtitle / Framing -->
    <text x="0" y="195" font-family="'Inter', 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#C2410C" letter-spacing="1">Quadro Angolano de Competências Digitais</text>
    
    <!-- Tagline / Descriptor -->
    <text x="0" y="225" font-family="'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="500" fill="#64748B" letter-spacing="0.5">Diagnóstico, Avaliação Psicometria e Inclusão Digital • ACITE Angola</text>
    
    <!-- Decorative underline bar -->
    <rect x="0" y="245" width="220" height="4" rx="2" fill="url(#pGold)" />
    <rect x="230" y="245" width="160" height="4" rx="2" fill="url(#pTerracotta)" />
    <rect x="400" y="245" width="80" height="4" rx="2" fill="url(#pIndigo)" />
  </g>
</svg>