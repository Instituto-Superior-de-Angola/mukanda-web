<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="acTerracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="acIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#0F2C59" />
      <stop offset="100%" stop-color="#071326" />
    </linearGradient>
    <linearGradient id="acGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Mukanda Main Lockup -->
  <g transform="translate(10, 20) scale(0.50)">
    <path d="M 250 80 C 175 80, 105 140, 105 215 C 105 290, 170 340, 230 385 L 250 400 L 250 330 C 205 295, 170 260, 170 215 C 170 175, 205 145, 250 145 Z" fill="url(#acTerracotta)" />
    <path d="M 250 80 C 325 80, 395 140, 395 215 C 395 290, 330 340, 270 385 L 250 400 L 250 330 C 295 295, 330 260, 330 215 C 330 175, 295 145, 250 145 Z" fill="url(#acIndigo)" />
    <polygon points="250,155 310,230 250,305 190,230" fill="url(#acGold)" />
    <circle cx="250" cy="230" r="14" fill="#0F2C59" stroke="#FFFFFF" stroke-width="4" />
    <circle cx="250" cy="80" r="12" fill="url(#acGold)" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="105" cy="215" r="11" fill="url(#acTerracotta)" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="395" cy="215" r="11" fill="url(#acIndigo)" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="250" cy="400" r="12" fill="#059669" stroke="#FFFFFF" stroke-width="3" />
    <line x1="250" y1="80" x2="250" y2="155" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 6" />
    <line x1="250" y1="305" x2="250" y2="400" stroke="#059669" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 6" />
  </g>

  <!-- Mukanda Typography -->
  <g transform="translate(280, 10)">
    <text x="0" y="70" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#FF6B35" letter-spacing="5">PROJECTO</text>
    <text x="0" y="140" font-family="'Space Grotesk', sans-serif" font-size="70" font-weight="900" fill="#0F2C59" letter-spacing="2">MUKANDA</text>
    <text x="0" y="182" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#C2410C">Quadro Angolano de Competências Digitais</text>
    <text x="0" y="210" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#64748B">AngoComp • ILDA (Índice de Literacia Digital de Angola)</text>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="770" y1="40" x2="770" y2="240" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />

  <!-- ACITE Institutional Co-Branding -->
  <g transform="translate(810, 40)">
    <!-- Proponent Badge Header -->
    <text x="0" y="30" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#64748B" letter-spacing="2">ENTIDADE PROPONENTE</text>
    
    <!-- ACITE Logo / Text -->
    <text x="0" y="85" font-family="'Space Grotesk', sans-serif" font-size="44" font-weight="900" fill="#0F2C59" letter-spacing="2">ACITE</text>
    <circle cx="155" cy="62" r="6" fill="#C2410C" />
    
    <!-- Full Name -->
    <text x="0" y="125" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#1E293B">Academia de Ciências</text>
    <text x="0" y="148" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#1E293B">Sociais e Tecnologias</text>
    
    <text x="0" y="180" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#64748B">Instituto Superior de Angola • Luanda</text>
  </g>
</svg>