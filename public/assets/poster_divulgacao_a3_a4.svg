<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1700" width="100%" height="100%">
  <defs>
    <linearGradient id="postBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071326" />
      <stop offset="40%" stop-color="#0F2C59" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="postTerracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="postGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="postShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#postBg)" />

  <!-- Background Decorative Geometric Lines / Sona Sand Algorithms -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="1.5" fill="none">
    <circle cx="600" cy="850" r="550" stroke-dasharray="8 8" />
    <circle cx="600" cy="850" r="420" />
    <circle cx="600" cy="850" r="280" stroke-dasharray="4 6" />
    <polygon points="600,300 1020,850 600,1400 180,850" />
    <line x1="180" y1="300" x2="1020" y2="1400" />
    <line x1="180" y1="1400" x2="1020" y2="300" />
  </g>

  <!-- Header Section: Proponent and Institutional Endorsement -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="1000" height="70" rx="12" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.15" />
    <text x="30" y="42" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" fill="#F59E0B" letter-spacing="3">ACADEMIA DE CIÊNCIAS SOCIAIS E TECNOLOGIAS (ACITE)</text>
    <text x="970" y="42" text-anchor="end" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#94A3B8" letter-spacing="1">LUANDA • HUÍLA • UÍGE</text>
  </g>

  <!-- Big Central Symbol (Glowing) -->
  <g transform="translate(475, 200) scale(0.50)" filter="url(#postShadow)">
    <path d="M 250 80 C 175 80, 105 140, 105 215 C 105 290, 170 340, 230 385 L 250 400 L 250 330 C 205 295, 170 260, 170 215 C 170 175, 205 145, 250 145 Z" fill="url(#postTerracotta)" />
    <path d="M 250 80 C 325 80, 395 140, 395 215 C 395 290, 330 340, 270 385 L 250 400 L 250 330 C 295 295, 330 260, 330 215 C 330 175, 295 145, 250 145 Z" fill="#38BDF8" />
    <polygon points="250,155 310,230 250,305 190,230" fill="url(#postGold)" />
    <circle cx="250" cy="230" r="16" fill="#0F2C59" stroke="#FFFFFF" stroke-width="4" />
    <circle cx="250" cy="230" r="6" fill="#F59E0B" />
    <circle cx="250" cy="80" r="13" fill="url(#postGold)" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="105" cy="215" r="12" fill="url(#postTerracotta)" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="395" cy="215" r="12" fill="#38BDF8" stroke="#FFFFFF" stroke-width="3" />
    <circle cx="250" cy="400" r="13" fill="#10B981" stroke="#FFFFFF" stroke-width="3" />
    <line x1="250" y1="80" x2="250" y2="155" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 6" />
    <line x1="250" y1="305" x2="250" y2="400" stroke="#10B981" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 6" />
  </g>

  <!-- Main Poster Typography -->
  <g text-anchor="middle">
    <!-- Category -->
    <text x="600" y="470" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700" fill="#FF6B35" letter-spacing="8">INICIATIVA ESTRATÉGICA NACIONAL</text>
    
    <!-- Mega Title -->
    <text x="600" y="565" font-family="'Space Grotesk', 'Outfit', sans-serif" font-size="92" font-weight="900" fill="#FFFFFF" letter-spacing="4">PROJECTO MUKANDA</text>
    
    <!-- Subtitle Bar -->
    <rect x="250" y="595" width="700" height="4" rx="2" fill="url(#postGold)" />
    
    <text x="600" y="650" font-family="'Space Grotesk', sans-serif" font-size="34" font-weight="700" fill="#FDE047" letter-spacing="1">Quadro Angolano de Competências Digitais</text>
    <text x="600" y="695" font-family="'Inter', sans-serif" font-size="22" font-weight="600" fill="#94A3B8">AngoComp • Da Tradição Ancestral à Soberania Digital</text>
  </g>

  <!-- Impact Highlights Grid (3 Columns) -->
  <g transform="translate(100, 750)">
    <!-- Column 1 -->
    <g transform="translate(0, 0)">
      <rect width="310" height="240" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="#FF6B35" stroke-width="1.5" />
      <text x="155" y="70" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="52" font-weight="900" fill="#FF6B35">2.500</text>
      <text x="155" y="115" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Cidadãos Certificados</text>
      <text x="155" y="155" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="#CBD5E1">Avaliação e capacitação em</text>
      <text x="155" y="180" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="#CBD5E1">competências digitais chave</text>
      <text x="155" y="210" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FDBA74">PILOTAGEM NACIONAL</text>
    </g>

    <!-- Column 2 -->
    <g transform="translate(345, 0)">
      <rect width="310" height="240" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="#F59E0B" stroke-width="1.5" />
      <text x="155" y="70" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="52" font-weight="900" fill="#F59E0B">120</text>
      <text x="155" y="115" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Formadores Multiplicadores</text>
      <text x="155" y="155" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="#CBD5E1">Capacitação avançada de</text>
      <text x="155" y="180" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="#CBD5E1">docentes e instrutores</text>
      <text x="155" y="210" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#FDE68A">MULTIPLICAÇÃO CÍVICA</text>
    </g>

    <!-- Column 3 -->
    <g transform="translate(690, 0)">
      <rect width="310" height="240" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="#38BDF8" stroke-width="1.5" />
      <text x="155" y="70" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="52" font-weight="900" fill="#38BDF8">ILDA</text>
      <text x="155" y="115" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Índice Nacional</text>
      <text x="155" y="155" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="#CBD5E1">Instrumento psicométrico de</text>
      <text x="155" y="180" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="#CBD5E1">diagnóstico para políticas públicas</text>
      <text x="155" y="210" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#BAE6FD">TRANSFERÊNCIA MESCTI/INE</text>
    </g>
  </g>

  <!-- 3 Pilares Regionais (Luanda, Huíla, Uíge) -->
  <g transform="translate(100, 1030)">
    <rect width="1000" height="150" rx="16" fill="url(#postTerracotta)" fill-opacity="0.15" stroke="#FF6B35" stroke-width="1.5" />
    <text x="50" y="45" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">PROVÍNCIAS PILOTO E TIPOLOGIAS DEMOGRÁFICAS</text>
    
    <g transform="translate(50, 75)">
      <circle cx="10" cy="15" r="8" fill="#FF6B35" />
      <text x="30" y="20" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">LUANDA</text>
      <text x="30" y="42" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#CBD5E1">Metropolitano &amp; Alta Densidade</text>
    </g>

    <g transform="translate(390, 75)">
      <circle cx="10" cy="15" r="8" fill="#F59E0B" />
      <text x="30" y="20" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">HUÍLA</text>
      <text x="30" y="42" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#CBD5E1">Urbano Interior &amp; Pólo Universitário</text>
    </g>

    <g transform="translate(720, 75)">
      <circle cx="10" cy="15" r="8" fill="#10B981" />
      <text x="30" y="20" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">UÍGE</text>
      <text x="30" y="42" font-family="'Inter', sans-serif" font-size="13" font-weight="400" fill="#CBD5E1">Predominantemente Rural &amp; Agrário</text>
    </g>
  </g>

  <!-- Call to Action Banner -->
  <g transform="translate(100, 1220)">
    <rect width="1000" height="230" rx="16" fill="#FFFFFF" filter="url(#postShadow)" />
    
    <!-- Left text -->
    <text x="50" y="65" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="900" fill="#0F2C59">Participe no Diagnóstico e Capacitação</text>
    <text x="50" y="105" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#475569">Consulte o portal oficial, conheça o quadro AngoComp e inscreva-se nas sessões de teste e formação.</text>
    
    <!-- CTA Button -->
    <rect x="50" y="135" width="340" height="55" rx="28" fill="url(#postTerracotta)" />
    <text x="220" y="170" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">ACEDER AO PORTAL MUKANDA</text>
    
    <!-- Contact Info -->
    <text x="440" y="160" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#0F2C59">investigacao@acite.ao • www.mukanda.acite.ao</text>
    <text x="440" y="185" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#64748B">Academia de Ciências Sociais e Tecnologias • Luanda, Angola</text>

    <!-- Simulated QR Code Container -->
    <g transform="translate(840, 35)">
      <rect width="110" height="110" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
      <!-- Stylized QR blocks -->
      <rect x="15" y="15" width="30" height="30" fill="#0F2C59" />
      <rect x="20" y="20" width="20" height="20" fill="#FFFFFF" />
      <rect x="25" y="25" width="10" height="10" fill="#0F2C59" />
      <rect x="65" y="15" width="30" height="30" fill="#0F2C59" />
      <rect x="70" y="20" width="20" height="20" fill="#FFFFFF" />
      <rect x="75" y="25" width="10" height="10" fill="#0F2C59" />
      <rect x="15" y="65" width="30" height="30" fill="#0F2C59" />
      <rect x="20" y="70" width="20" height="20" fill="#FFFFFF" />
      <rect x="25" y="75" width="10" height="10" fill="#0F2C59" />
      <rect x="55" y="55" width="12" height="12" fill="#FF6B35" />
      <rect x="75" y="65" width="20" height="12" fill="#0F2C59" />
      <rect x="55" y="75" width="15" height="20" fill="#0F2C59" />
      <text x="55" y="130" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#64748B">SCAN ME</text>
    </g>
  </g>

  <!-- Footer Institutional Bar -->
  <g transform="translate(100, 1500)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />
    <text x="0" y="50" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Entidade Proponente: ACITE (Instituto Superior de Angola)</text>
    <text x="0" y="75" font-family="'Inter', sans-serif" font-size="12" font-weight="400" fill="#64748B">Parceiros &amp; Financiadores Previstos: FUNDECIT • União Europeia (CAP4) • UNESCO • Sector Privado</text>
    <text x="1000" y="60" text-anchor="end" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" fill="#F59E0B">CIÊNCIA • INCLUSÃO • SOBERANIA</text>
  </g>
</svg>